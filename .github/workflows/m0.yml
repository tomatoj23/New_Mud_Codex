name: m0-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: new_mud
          POSTGRES_USER: new_mud
          POSTGRES_PASSWORD: new_mud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U new_mud -d new_mud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: new_mud.settings.test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: new_mud
      POSTGRES_USER: new_mud
      POSTGRES_PASSWORD: new_mud
      POSTGRES_CONNECT_TIMEOUT: 5
      RUN_POSTGRES_TESTS: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.14.2
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade \
            "pip==26.1.2" "setuptools==83.0.0" "wheel==0.47.0"
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e ".[dev]"
          python -m pip check

      - name: Static checks
        run: |
          ruff check scripts src tests
          ruff format --check scripts src tests
          mypy src scripts tests

      - name: Contract structure
        run: python scripts/verify_m0.py --structural-only

      - name: Django and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run --skip-checks
          python manage.py migrate --noinput
          python manage.py migrate content zero --noinput
          python manage.py migrate content 0001 --noinput

      - name: Tests
        run: pytest
