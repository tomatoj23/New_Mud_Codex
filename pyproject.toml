[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "new-mud-engine"
version = "0.1.0"
description = "Django/ASGI rewrite of the XKX100 MUD runtime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django>=6.0.7,<6.1",
  "channels>=4.3.2,<5",
  "daphne>=4.2.2,<5",
  "djangorestframework>=3.17.1,<4",
  "jsonschema>=4.26,<5",
  "psycopg[binary]>=3.3.4,<4",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
dev = [
  "django-stubs>=6.0.7,<6.1",
  "djangorestframework-stubs>=3.17,<3.18",
  "mypy>=2.3,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-django>=4.12,<5",
  "ruff>=0.15.22,<0.16",
  "types-channels>=4.3.0.20260518,<4.4",
  "types-jsonschema>=4.26.0.20260518,<4.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"new_mud.mudlibs.jinyong_core" = ["seed/*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "new_mud.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
cache_dir = "artifacts/reports/pytest-cache"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "new_mud.settings.test"
